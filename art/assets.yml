# Every picture the game needs from the art pipeline (npm run import-art / gen-image).
#   type:   sprite      one picture, cut out and outlined          (size: [w, h] = the box it must fit, in PICTURE pixels:
#                                                                   art has 2 per scene pixel, so a 40x70 thing on screen is [80, 140])
#           sheet       a grid of equal frames, one cut-out each   (frame: [w, h], grid: [columns, rows])
#           icon        like sprite, but centred in the box
#           background  a full scene picture: shrunk and snapped to the palette, no cut-out, no outline
#   out:    where the finished file goes, relative to games/<game>/assets/ (the same name the placeholder had)
#   raw:    the picture you generated, default art/raw/<asset id>.png
#   gen_size: optional shape to ask the image service for, "1024x1536" (default: wide for backgrounds, the grid's shape
#           for sheets, square otherwise; see sizeFor in tools/art/imageApi.ts)
#   colors: optional; how many colours this picture's own palette may have, outline included (default 16, backgrounds 32)
#   palette: optional; `shared` snaps to art/palette.hex instead of choosing colours to suit the picture
#   focus:  backgrounds only; which part to keep when the picture is not 320x144-shaped: 0 = top, 0.5 = middle (default), 1 = bottom
#   prompt: what to ask the image generator ({style}, {cutout}... come from art/prompts/fragments.yml)
# An asset counts as "imported" once art/raw/<id>.png exists; the palette test then checks its output.
palette: art/palette.hex
outline: '#340034'
game: grelok
assets:
  # Grognak is made of several pictures (art/raw/grognak_<part>.png), one per animation: an image generator keeps
  # a character consistent far better in a small strip than in one big grid. Each part becomes a row of the sheet
  # (6 frames of 64x96 per row); `frames` hands its cells, read row by row, to named animations. Walking left is the
  # walking-right picture mirrored by the game. After importing, game.yml needs the animation table the importer prints.
  # Full prompts: art/briefs/07-grognak-animation.md.
  # `sizes`: the importer also writes the sheet at smaller sizes (grognak_94.png .. _58.png), each shrunk from the raw
  # pictures, so in perspective the game draws him 1:1 instead of scaling pixel art (which breaks it).
  grognak:
    type: sheet
    out: sprites/grognak.png
    frame: [64, 96]
    sizes: {min: 0.6, step: 2}
    columns: 6
    parts:
      - name: walk_e
        grid: [3, 2]
        frames: {walk_e: 6}
        prompt: '{style} {cutout} {grognak} A 6-frame walk cycle seen from the side, walking to the right, 3 columns x 2
          rows: contact, down, passing, contact (other leg), down, passing.'
      - name: walk_s
        grid: [2, 2]
        frames: {walk_s: 4}
        prompt: '{style} {cutout} {grognak} A 4-frame walk cycle walking towards the viewer, 2 x 2: left foot forward,
          passing, right foot forward, passing.'
      - name: walk_n
        grid: [2, 2]
        frames: {walk_n: 4}
        prompt: '{style} {cutout} {grognak} A 4-frame walk cycle walking away from the viewer (seen from behind), 2 x 2:
          left foot forward, passing, right foot forward, passing.'
      - name: idle
        grid: [3, 1]
        frames: {idle_s: 1, idle_n: 1, idle_e: 1}
        prompt: '{style} {cutout} {grognak} Standing still, 3 views side by side: front, back, side facing right.'
      - name: talk
        grid: [2, 2]
        frames: {talk_s: 2, talk_e: 2}
        prompt: '{style} {cutout} {grognak} Talking, 2 x 2: front mouth shut, front mouth open with a hand gesture, side
          (facing right) mouth shut, side mouth open with a hand gesture.'
      - name: reach
        grid: [2, 2]
        frames: {reach_e: 2, reach_s: 1, reach_n: 1}
        prompt: '{style} {cutout} {grognak} Reaching for something, 2 x 2: side (facing right) arm half out, side arm out
          low, front bending to reach down, back reaching forward.'
  # TEMPORARY: today's Grognak (one 3x4 picture, the original layout) with the same sizes, until brief 07's parts
  # exist. Then delete this entry and import `grognak` (both write sprites/grognak.png).
  grognak_v1:
    type: sheet
    out: sprites/grognak.png
    raw: art/raw/grognak.png
    prompt: '{style} {cutout} Character sheet of {grognak} 4 rows (facing front, back, right, left) by 3 columns (standing,
      walking step one, walking step two). Same size in every cell.'
    frame: [64, 96]
    grid: [3, 4]
    animations: {idle_s: [0], walk_s: [0, 1, 0, 2], idle_n: [3], walk_n: [3, 4, 3, 5], idle_e: [6], walk_e: [6, 7, 6, 8], idle_w: [9], walk_w: [9, 10, 9, 11]}
    sizes: {min: 0.6, step: 2}
  standing_stone:
    type: sprite
    out: sprites/standing_stone.png
    prompt: '{style} {cutout} {menhir}'
    size: [80, 140]
  zombie_standing:
    type: sprite
    out: sprites/zombie_standing.png
    prompt: '{style} {cutout} {zombie} Standing.'
    size: [96, 128]
  zombie_down:
    type: sprite
    out: sprites/zombie_down.png
    prompt: '{style} {cutout} {zombie} Lying flat on the ground, defeated.'
    size: [120, 48]
  open_grave:   # a separate sprite, so it sits exactly under its hotspot (the zombie falls into it)
    type: sprite
    out: sprites/open_grave.png
    prompt: '{style} {cutout} A freshly dug open grave seen from the side and a little from above: a dark rectangular hole
      in the ground with a mound of earth beside it and a leaning wooden grave marker.'
    size: [100, 50]
  basin:   # the holy water basin on its marble pillar (chapel interior), a sprite so it sits under its hotspot
    type: sprite
    out: sprites/basin.png
    prompt: '{style} {cutout} A small marble holy water basin on a slender carved marble pillar, the water glowing faintly
      pale blue.'
    size: [60, 100]
  chapel_door_open:
    type: sprite
    out: sprites/chapel_door_open.png
    prompt: '{style} {cutout} An old wooden chapel door standing open, dark inside, pale stone frame.'
    size: [80, 120]
  pebble:
    type: sprite
    out: sprites/pebble.png
    prompt: '{style} {cutout} A single small grey pebble.'
    size: [24, 16]
  rubble:   # a separate sprite (not part of the background), so it sits exactly under its hotspot and the gemstone
    type: sprite
    out: sprites/rubble.png
    prompt: '{style} {cutout} A low, wide heap of rubble: big and small dark grey rocks and stones, much wider than tall.'
    size: [144, 56]
  gemstone:
    type: sprite
    out: sprites/gemstone.png
    prompt: '{style} {cutout} A beautiful glowing gemstone, faceted, soft glow.'
    size: [20, 16]
  gemstone_shards:
    type: sprite
    out: sprites/gemstone_shards.png
    prompt: '{style} {cutout} Two glowing gemstone shards lying together.'
    size: [40, 20]
  grelok:
    type: sprite
    out: sprites/grelok.png
    prompt: '{style} {cutout} {grelok} Standing, menacing, facing the viewer, laughing.'
    size: [80, 128]
  blacksmith:
    type: sprite
    out: sprites/blacksmith.png
    prompt: '{style} {cutout} {blacksmith}'
    size: [80, 140]
  priest:
    type: sprite
    out: sprites/priest.png
    prompt: '{style} {cutout} {priest}'
    size: [60, 80]
  wizard:
    type: sprite
    out: sprites/wizard.png
    prompt: '{style} {cutout} {wizard}'
    size: [50, 40]
  icon_chapel_key:
    type: icon
    out: icons/chapel_key.png
    prompt: '{style} {cutout} Inventory icon, big and simple so it reads when tiny: a large brass key with a paper tag.'
    size: [48, 32]
  icon_gemstone:
    type: icon
    out: icons/gemstone.png
    prompt: '{style} {cutout} Inventory icon, big and simple so it reads when tiny: a glowing gemstone.'
    size: [48, 32]
  icon_gemstone_shards:
    type: icon
    out: icons/gemstone_shards.png
    prompt: '{style} {cutout} Inventory icon, big and simple so it reads when tiny: two glowing gemstone shards.'
    size: [48, 32]
  icon_jug:
    type: icon
    out: icons/jug.png
    prompt: '{style} {cutout} Inventory icon, big and simple so it reads when tiny: an empty clay jug marked XXX.'
    size: [48, 32]
  icon_pebble:
    type: icon
    out: icons/pebble.png
    prompt: '{style} {cutout} Inventory icon, big and simple so it reads when tiny: a tiny grey pebble.'
    size: [48, 32]
  icon_rusty_sword:
    type: icon
    out: icons/rusty_sword.png
    prompt: '{style} {cutout} Inventory icon, big and simple so it reads when tiny: a rusty old sword, pointing up-right.'
    size: [48, 32]
  icon_shining_sword:
    type: icon
    out: icons/shining_sword.png
    prompt: '{style} {cutout} Inventory icon, big and simple so it reads when tiny: a shining sword with a glowing blade,
      pointing up-right.'
    size: [48, 32]
  bg_plain:
    type: background
    out: backgrounds/plain.png
    prompt: '{style} {scene} a wide open crossroads at golden hour, long shadows, warm orange sky; leave space for a huge
      standing stone in the middle.'
    size: [640, 288]
  bg_mountain:
    type: background
    out: backgrounds/mountain.png
    prompt: '{style} {scene} menacing red-lit rocky mountain path, dark cliffs, rubble, a cold wine-red sky.'
    size: [640, 288]
  bg_town:
    type: background
    out: backgrounds/town.png
    prompt: '{style} {scene} a busy small medieval town street, wooden houses, a smithy with a glowing forge, dusty ground.'
    size: [640, 288]
  bg_swamp:
    type: background
    out: backgrounds/swamp.png
    prompt: '{style} {scene} a gloomy green swamp with mist, sickly yellow light, a small island on the right for a wizard''s
      tower.'
    size: [640, 288]
  bg_chapel:
    type: background
    out: backgrounds/chapel.png
    prompt: '{style} {scene} an old pale-stone chapel at purple dusk, a graveyard path, a locked wooden door on the right.'
    size: [640, 288]
  bg_chapel_interior:
    type: background
    out: backgrounds/chapel_interior.png
    prompt: '{style} {scene} a dark quiet chapel interior, candles, stone arches, a marble basin in the middle.'
    size: [640, 288]
