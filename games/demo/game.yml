# The Rusty Gate - a two-screen mini game that proves the engine knows nothing about Grelok.
# Play it with ?game=demo. Everything that makes it a different game lives in this folder.
title: The Rusty Gate
start: lane
startPosition: [120, 116]

# The goat herder. (The placeholder generator draws its usual figure on this sheet until real art exists.)
player:
  sprite: sprites/herder.png
  frameWidth: 64
  frameHeight: 96

# Only four buttons: there is nobody to talk to or give things to. Column-major, so the first three are the
# left column. Leave this out and the engine shows its default six (see DEFAULT_VERBS in sceneTypes.ts).
verbs:
  - { verb: pick_up, label: Pick up, objects: 1 }
  - { verb: use, label: Use, objects: 2, preposition: with }
  - { verb: look_at, label: Look at, objects: 1 }
  - { verb: push, label: Push, objects: 1 }
