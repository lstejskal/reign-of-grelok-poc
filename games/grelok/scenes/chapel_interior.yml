# Scene for location "chapel_interior". Coordinates: x 0-319, y 0-143.
# Layout follows the approved preview in art/briefs/06-chapel-interior-generation-log.md: the entrance door on the
# left (the way out), the holy water basin left of centre, benches behind, the altar on its steps at the right.

background: backgrounds/chapel_interior.png
walkmask: walkmasks/chapel_interior.png   # white = walkable; painted from walkArea (npm run walkmask -- grelok chapel_interior)
music: music/chapel_interior.mp3   # loops while the player is here; changing scene crossfades to the next tune
scale: {top: 0.6, bottom: 1.0}   # Grognak is drawn at 60% on the farthest floor row, 100% on the nearest

# The floor, traced from the background: the flagstones in front of the benches, from the door's threshold on the
# left to the foot of the altar steps on the right; not the steps, not through the basin's foot.
walkArea:
  floor:
    - [[18, 108], [50, 104], [60, 98], [226, 98], [234, 104], [240, 110], [320, 112], [320, 144], [0, 144], [0, 112]]
  blocked:
    - [[126, 111], [144, 111], [145, 117], [125, 117]]   # the basin's foot

hotspots:   # later entries are on top
  - id: basin
    polygon: [[121, 67], [149, 67], [149, 116], [121, 116]]
    walkTo: [135, 122]
    facing: n

sprites:
  - id: basin
    thing: basin
    x: 135
    y: 116
    image: sprites/basin.png

exits:
  - direction: w   # the entrance door on the left
    polygon: [[18, 44], [50, 44], [50, 108], [18, 108]]
    walkTo: [34, 112]
    spawn: [46, 114]
