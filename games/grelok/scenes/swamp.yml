# Scene for location "swamp". Coordinates: x 0-319, y 0-143. Music is added in Step 15.

background: backgrounds/swamp.png
walkmask: walkmasks/swamp.png   # white = walkable
music: music/swamp.mp3   # loops while the player is here; changing scene crossfades to the next tune
scale: {top: 0.6, bottom: 1.0}   # Grognak is drawn at 60% on the farthest floor row, 100% on the nearest

hotspots:   # later entries are on top
  - id: wizards_tower
    polygon: [[130, 10], [200, 10], [200, 80], [130, 80]]
    walkTo: [170, 100]
    facing: n
  - id: wizard
    polygon: [[150, 14], [175, 14], [175, 34], [150, 34]]
    walkTo: [165, 100]
    facing: n
  - id: gemstone_shards
    polygon: [[100, 110], [120, 110], [120, 120], [100, 120]]
    walkTo: [110, 124]

sprites:
  - id: gemstone_shards
    thing: gemstone_shards
    x: 110
    y: 120
    image: sprites/gemstone_shards.png

exits:
  - direction: e
    polygon: [[300, 40], [320, 40], [320, 130], [300, 130]]
    walkTo: [292, 110]
    spawn: [286, 110]
